# Generic writable rootless-container-storage default.
#
# Rootless Podman computes $HOME/.local/share/containers/storage at
# runtime (containers/storage's rootless graph-root default); that path
# needs no pre-creation here because Cloud-init's cc_users_groups module
# creates each user's home directory when it provisions the user, and the
# resulting directory is already writable by that user.
#
# /var/lib/containers is the separate, well-known *system-wide* fallback
# path (matches Fedora/RHEL podman packaging, and is also where the
# systemd-level podman.socket/podman.service unit — enabled by
# podman-vm-user.preset for the user instance, and usable rootful too —
# looks by default for the root user's own storage). It is not created by
# any FSDK component or by podman's own install, so it must exist and be
# writable before first container use, whichever way Podman is invoked.
d /var/lib/containers/storage 0711 root root -
d /var/lib/containers/cache 0711 root root -
