# actionlint configuration
paths:
  .github/workflows/prow.yml:
    ignore:
      - 'has no explicit cache access limit for low-trust trigger'

# https://github.com/rhysd/actionlint/blob/main/docs/config.md

# actionlint does not yet know the ubuntu-26.04 runner images. Until upstream
# adds them, list them here (same as projectbluefin/common).
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
