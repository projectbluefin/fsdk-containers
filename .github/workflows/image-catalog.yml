name: image-catalog

# Every BuildStream element for an OCI image is generated from its
# catalog/<name>.yaml record. Without a gate they drift the moment someone
# hand-edits an element, and a stale element silently ships a different image
# than the record describes.

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'elements/**'
      - 'include/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Justfile'
      - '.github/requirements/**'
      - '.github/workflows/image-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'elements/**'
      - 'include/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Justfile'
      - '.github/requirements/**'
      - '.github/workflows/image-catalog.yml'

permissions: {}

jobs:
  catalog:
    name: Validate image catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install python dependencies
        run: 'python3 -m pip install --user --require-hashes --only-binary=:all: -r .github/requirements/verify.txt'

      - name: Python test suite
        run: python3 -m unittest discover -s tests -v

      - name: Generated elements are current
        run: python3 scripts/generate_image_elements.py --check
