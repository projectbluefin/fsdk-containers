name: skill-catalog

# docs/skills/index.json and index.md are generated from skill front matter.
# Without a gate they drift the moment someone edits a skill by hand, and a
# stale catalog silently sends agents to the wrong file.

on:
  pull_request:
    paths:
      - 'docs/skills/**'
      - 'scripts/generate_skill_index.py'
      - 'tests/test_skill_index.py'
  push:
    branches: [main]
    paths:
      - 'docs/skills/**'
      - 'scripts/generate_skill_index.py'
      - 'tests/test_skill_index.py'

permissions: {}

jobs:
  catalog:
    name: Validate skill catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install python dependencies
        run: python3 -m pip install --user pyyaml jsonschema

      # Exercises the generator's guard rails: missing front matter, missing
      # required keys, an entry_point that disagrees with its own path, the
      # pin_unchanged_generated_at logic, and validate_catalog error reporting.
      - name: Generator guard rails hold
        run: python3 -m unittest discover -s tests -p 'test_skill_index*.py' -v

      # Validates every skill's front matter against docs/skills/index.schema.json
      # and fails if the committed index.json/index.md are not what the front
      # matter generates.
      - name: Check index is current and front matter is valid
        run: python3 scripts/generate_skill_index.py --check

      - name: Enforce the 500-line hard cap on skills
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ]; then
              echo "::error file=$f::$f is $n lines, over the 500-line hard max. Split it into a per-skill directory with references/."
              status=1
            elif [ "$n" -gt 200 ]; then
              echo "::warning file=$f::$f is $n lines, over the 200-line soft max. Consider splitting it."
            fi
          done < <(find docs/skills -name '*.md' -not -name 'index.md')
          exit "$status"
