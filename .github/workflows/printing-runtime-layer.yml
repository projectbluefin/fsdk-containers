name: Printing runtime layer

# Builds oci/printing-runtime-layer.bst -- the shared, slimmed printing
# runtime (CUPS, cups-filters, ghostscript, PAPPL, python3, bash) -- and
# publishes it as an OCI base layer: ghcr.io/<owner>/printing-runtime-layer.
# Pull requests only `bst show` the element (build.yml `validate` -> `just validate`),
# so this workflow has no pull_request trigger. Consumer contract, tag scheme and
# verification: docs/skills/printing-base.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

concurrency:
  group: printing-runtime-layer-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  LAYER_REPO: ghcr.io/${{ github.repository_owner }}/printing-runtime-layer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Sigstore keyless signing
    outputs:
      key: ${{ steps.tags.outputs.key }}
      run_tag: ${{ steps.tags.outputs.run_tag }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: just
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install host requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 podman skopeo

      - name: Resolve key and tags
        id: tags
        env:
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          KEY="$(just printing-runtime-layer-key)"
          if [[ ! "${KEY}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: oci/printing-runtime-layer.bst full key is not a sha256: '${KEY}'" >&2
            exit 1
          fi
          # Immutable same-run tag prevents assembling index from stale previous runs
          RUN_TAG="${ARCH}-run-${RUN_ID}"
          if [[ "${REF}" == refs/heads/main ]]; then
            TAGS="${RUN_TAG} ${ARCH}-${KEY} ${ARCH}-latest"
          else
            TAGS="${RUN_TAG} ${ARCH}-test-${RUN_ID}"
          fi
          {
            echo "key=${KEY}"
            echo "run_tag=${RUN_TAG}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "==> oci/printing-runtime-layer.bst ${ARCH} full key ${KEY}; tags: ${TAGS}"

      - name: Log in to ghcr
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.docker
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GH_ACTOR}" --password-stdin
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GH_ACTOR}" --password-stdin --compat-auth-file ~/.docker/config.json

      - name: Build the shared printing runtime layer
        run: just build-printing-runtime-layer

      - name: Push architecture image and sign
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE_ID="$(podman pull -q oci:.build-out)"
          FIRST_TAG=""
          for tag in ${TAGS}; do
            podman push "${IMAGE_ID}" "${LAYER_REPO}:${tag}"
            echo "==> pushed ${LAYER_REPO}:${tag}"
            if [[ -z "${FIRST_TAG}" ]]; then
              FIRST_TAG="${tag}"
            fi
          done
          # Authenticate skopeo using Docker config created at login
          DIGEST="$(skopeo inspect --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "docker://${LAYER_REPO}:${FIRST_TAG}" | jq -r '.Digest')"
          # Always sign per-arch image digest (both main and dev proof tags)
          cosign sign -y "${LAYER_REPO}@${DIGEST}"
          for tag in ${TAGS}; do
            cosign verify \
              --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${LAYER_REPO}:${tag}" >/dev/null
            echo "==> verified signature on ${LAYER_REPO}:${tag}"
          done

  manifest:
    needs: build
    # Require build success: never assemble index if any architecture build failed
    if: needs.build.result == 'success' && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.docker
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GH_ACTOR}" --password-stdin
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GH_ACTOR}" --password-stdin --compat-auth-file ~/.docker/config.json

      - name: Assemble multi-arch index, sign, and verify
        env:
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${REF}" == refs/heads/main ]]; then
            TAGS="latest"
          else
            TAGS="test-${RUN_ID}"
          fi
          # Always assemble from immutable same-run architecture tags, never stale mutable aliases
          DIGEST=""
          for tag in ${TAGS}; do
            docker buildx imagetools create -t "${LAYER_REPO}:${tag}" \
              --annotation "index:org.opencontainers.image.ref.name=${LAYER_REPO}:${tag}" \
              "${LAYER_REPO}:x86_64-run-${RUN_ID}" "${LAYER_REPO}:aarch64-run-${RUN_ID}"
            d="$(skopeo inspect --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "docker://${LAYER_REPO}:${tag}" | jq -r '.Digest')"
            if [[ -n "${DIGEST}" && "${d}" != "${DIGEST}" ]]; then
              echo "ERROR: ${LAYER_REPO}:${tag} resolved to ${d}, expected ${DIGEST}" >&2
              exit 1
            fi
            DIGEST="${d}"
            echo "==> ${LAYER_REPO}:${tag} -> ${DIGEST}"
          done
          # Always sign index digest (both main and dev proof tags)
          cosign sign -y "${LAYER_REPO}@${DIGEST}"
          for tag in ${TAGS}; do
            cosign verify \
              --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${LAYER_REPO}:${tag}" >/dev/null
            echo "==> verified signature on ${LAYER_REPO}:${tag}"
          done
          {
            echo "### printing-runtime-layer"
            echo
            echo "- tags: \`${TAGS}\`"
            echo "- digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
