name: Printing runtime layer

# Builds oci/printing-runtime-layer.bst -- the shared, slimmed printing
# runtime (CUPS, cups-filters, ghostscript, PAPPL, python3, bash) -- and
# publishes it as a real, signed OCI base layer: ghcr.io/<owner>/
# printing-runtime-layer. Every printer application pinned to the same
# fsdk-containers ref builds this exact layer, so pulling a second printer
# family after a first only transfers its own app layer (#342). This is
# NOT the printing-base-devel CAS bundle (printing-base.yml): that one is a
# build-time cache fragment and never a runnable image. Pull requests only
# `bst show` the element (build.yml `validate` -> `just validate`), so this
# workflow has no pull_request trigger. Consumer contract, tag scheme and
# verification: docs/skills/printing-base.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

concurrency:
  group: printing-runtime-layer-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  LAYER_REPO: ghcr.io/${{ github.repository_owner }}/printing-runtime-layer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      key: ${{ steps.tags.outputs.key }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: just
      - name: Install host requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 podman skopeo

      - name: Resolve key and tags
        id: tags
        env:
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          KEY="$(just printing-runtime-layer-key)"
          if [[ ! "${KEY}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: oci/printing-runtime-layer.bst full key is not a sha256: '${KEY}'" >&2
            exit 1
          fi
          if [[ "${REF}" == refs/heads/main ]]; then
            TAGS="${ARCH}-${KEY} ${ARCH}-latest"
          else
            TAGS="${ARCH}-test-${RUN_ID}"
          fi
          {
            echo "key=${KEY}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "==> oci/printing-runtime-layer.bst ${ARCH} full key ${KEY}; tags: ${TAGS}"

      - name: Log in to ghcr
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | podman login ghcr.io -u "${GH_ACTOR}" --password-stdin

      - name: Build the shared printing runtime layer
        run: just build-printing-runtime-layer .build-out

      - name: Push architecture image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE_ID="$(podman pull -q oci:.build-out)"
          for tag in ${TAGS}; do
            podman push "${IMAGE_ID}" "${LAYER_REPO}:${tag}"
            echo "==> pushed ${LAYER_REPO}:${tag}"
          done

  manifest:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.docker
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GH_ACTOR}" --password-stdin
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GH_ACTOR}" --password-stdin --compat-auth-file ~/.docker/config.json

      - name: Assemble multi-arch index, sign, and verify
        env:
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${REF}" == refs/heads/main ]]; then
            TAGS="latest"
          else
            TAGS="test-${RUN_ID}"
          fi
          DIGEST=""
          for tag in ${TAGS}; do
            docker buildx imagetools create -t "${LAYER_REPO}:${tag}" \
              --annotation "index:org.opencontainers.image.ref.name=${LAYER_REPO}:${tag}" \
              "${LAYER_REPO}:x86_64-${tag}" "${LAYER_REPO}:aarch64-${tag}"
            d="$(skopeo inspect --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "docker://${LAYER_REPO}:${tag}" | jq -r '.Digest')"
            if [[ -n "${DIGEST}" && "${d}" != "${DIGEST}" ]]; then
              echo "ERROR: ${LAYER_REPO}:${tag} resolved to ${d}, expected ${DIGEST}" >&2
              exit 1
            fi
            DIGEST="${d}"
            echo "==> ${LAYER_REPO}:${tag} -> ${DIGEST}"
          done
          if [[ "${REF}" == refs/heads/main ]]; then
            cosign sign -y "${LAYER_REPO}@${DIGEST}"
            for tag in ${TAGS}; do
              cosign verify \
                --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "${LAYER_REPO}:${tag}" >/dev/null
              echo "==> verified signature on ${LAYER_REPO}:${tag}"
            done
          fi
          {
            echo "### printing-runtime-layer"
            echo
            echo "- tags: \`${TAGS}\`"
            echo "- digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
