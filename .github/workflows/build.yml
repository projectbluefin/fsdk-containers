name: Build images

# Orchestrator: resolves the canonical OCI image manifest once (see
# elements/targets.json / just image-matrix), then fans out to the two
# independent, reusable per-artifact-class workflows -- OCI distroless
# images (oci-images.yml) and the podman-vm guest disk (vm-guest.yml) -- so
# a failure in one unrelated image never blocks or obscures the other's
# status in the Actions UI. See docs/skills/ci-tooling.md.

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [fsdk-updated]
  workflow_dispatch:
    inputs:
      image:
        description: Optional OCI image to build; leave empty to build every manifest target
        required: false
        default: ""
        type: string

concurrency:
  # A targeted manual run must not cancel an unrelated image's targeted run.
  # oci-images.yml independently serializes publication for the same image.
  group: build-${{ github.event.client_payload.ref || github.ref }}-${{ inputs.image || 'all' }}
  cancel-in-progress: true

# Ceiling permissions for the whole run. Reusable-workflow calling jobs
# (oci-images, vm-guest) cannot be granted more than this; each restricts
# further to only what its own jobs use. Jobs that don't call a reusable
# workflow set their own, narrower `permissions:` below.
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just
      - name: Resolve element graph
        run: just validate

  # Resolve the OCI image matrix from the single canonical manifest
  # (elements/targets.json) once, so oci-images.yml never hand-maintains its
  # own copy of the image list. Adding a package requires one entry in that
  # manifest, not an edit to any workflow.
  matrix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      oci_images: ${{ steps.set.outputs.oci_images }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}
      - id: set
        env:
          SELECTED_IMAGE: ${{ inputs.image || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${SELECTED_IMAGE}" ]]; then
            if ! jq -e --arg image "${SELECTED_IMAGE}" \
              '.oci_images | index($image) != null' elements/targets.json >/dev/null; then
              echo "ERROR: unknown OCI image '${SELECTED_IMAGE}' (see elements/targets.json)" >&2
              exit 1
            fi
            OCI_IMAGES="$(jq -cn --arg image "${SELECTED_IMAGE}" '[$image]')"
          else
            OCI_IMAGES="$(jq -c '.oci_images' elements/targets.json)"
          fi
          echo "oci_images=${OCI_IMAGES}" >> "$GITHUB_OUTPUT"

  oci-images:
    needs: matrix
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.oci_images) }}
    uses: ./.github/workflows/oci-images.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      image: ${{ matrix.image }}
      ref: ${{ github.event.client_payload.ref || github.ref }}

  vm-guest:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/vm-guest.yml
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      ref: ${{ github.event.client_payload.ref || github.ref }}

  # Compact status/duration summary across every target (OCI images x arch,
  # manifest assembly, and the VM guest x arch) so slow BuildStream legs are
  # visible at a glance instead of having to open each job individually.
  # `always()` so this never gates publication -- it is purely informational.
  summary:
    needs: [oci-images, vm-guest]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Render target status/duration table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Build target summary"
            echo
            echo "| Target | Status | Duration |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.name != "summary" and .name != "validate")
                  | [.name,
                     (.conclusion // "in_progress"),
                     (if .completed_at and .started_at
                      then (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | tostring) + "s"
                      else "n/a" end)] | @tsv' \
          | awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' >> "$GITHUB_STEP_SUMMARY"
