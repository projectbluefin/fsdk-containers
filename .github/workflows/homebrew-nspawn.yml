name: Verify homebrew nspawn image

# The homebrew nspawn tarball is the machine-image packaging of the homebrew
# rootfs; the OCI packaging of the SAME rootfs is built by the normal OCI
# lane from elements/targets.json. This lane is expensive and unrelated to
# OCI publication, so verify it weekly and on demand, not on every PR.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

concurrency:
  group: homebrew-nspawn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-homebrew-nspawn:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just

      - name: Verify homebrew nspawn machine image
        run: just verify-homebrew-nspawn

      - name: Summarize exported artifacts
        if: always()
        run: |
          if [ -d dist ]; then
            {
              echo '## homebrew nspawn artifacts'
              echo
              echo '```text'
              ls -lh dist
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
