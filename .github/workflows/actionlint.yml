name: actionlint

# The delivery pipeline is ~25KB of workflow YAML plus a composite action, and
# a typo in it is only discovered by a red release run. Lint it like code.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'

permissions: {}

jobs:
  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # reviewdog's github-pr-check reporter annotates the PR.
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@78b296370c5c75abca79860e9baa9846e3286a29 # v1.84.0
        with:
          reporter: github-pr-check
          fail_on_error: true

  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: docker://ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          args: --format=github --min-severity=medium --min-confidence=medium .
