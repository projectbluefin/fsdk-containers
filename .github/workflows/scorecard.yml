name: Scorecard supply-chain security

# Thin caller pattern shared with projectbluefin/dakota and
# projectbluefin/common. The results land in the code-scanning dashboard and
# on the OpenSSF badge.

on:
  # For the Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check fresh.
  schedule:
    - cron: '17 9 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the results to the code-scanning dashboard.
      security-events: write
      # Publish results and get a badge (ossf/scorecard-action#publishing-results).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
