name: Scorecard supply-chain security

# Thin caller pattern shared with projectbluefin/dakota and
# projectbluefin/common. The results land in the code-scanning dashboard and
# on the OpenSSF badge.

on:
  # For the Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check fresh.
  schedule:
    - cron: '17 9 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the results to the code-scanning dashboard.
      security-events: write
      # Publish results and get a badge (ossf/scorecard-action#publishing-results).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
