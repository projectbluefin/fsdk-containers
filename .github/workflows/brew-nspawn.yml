name: Verify brew nspawn image

# Non-distroless machine lane, separate from OCI publication. Contract tests
# run for relevant pull requests; native artifact/boot checks stay weekly/on demand.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - 'elements/brew/**'
      - 'elements/oci/brew-nspawn.bst'
      - 'plugins/sources/ghcr_tar.py'
      - 'scripts/verify_brew.py'
      - 'tests/test_brew*.py'
      - 'tests/brew-boot.sh'
      - 'Justfile'
      - 'project.conf'
      - '.github/workflows/brew-nspawn.yml'

concurrency:
  group: brew-nspawn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brew-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise seed and authenticated source contracts
        run: python3 -m unittest discover -s tests -p 'test_brew*.py' -v
  verify-brew:
    if: github.event_name != 'pull_request'
    needs: brew-contract
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: just

      - name: Install consumer inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes erofs-utils binutils zstd systemd-container
          sudo modprobe erofs

      - name: Verify tar and raw contracts and offline guest user scopes
        run: just verify-brew-boot

      - name: Summarize exported artifacts
        if: always()
        run: |
          if [ -d dist ]; then
            {
              echo '## brew nspawn artifacts'
              echo
              echo '```text'
              ls -lh dist
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
