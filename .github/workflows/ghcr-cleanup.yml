name: GHCR cleanup

# This repo publishes 7 manifest packages plus 14 per-architecture staging
# packages (base-x86_64, base-aarch64, ...), and every FSDK point release adds
# another layer set to each. The org-wide cleanup in projectbluefin/actions
# covers the bluefin, dakota and common families only, so nothing here was
# ever pruned.
#
# Untagged manifests ONLY -- the tagged exceptions (:latest and
# printing-base-devel) are handled in their own steps below (issue #364). FSDK point-release
# tags are immutable by contract
# (docs/skills/container-standards.md): a consumer pinned to :25.08.13 must
# still be able to pull it, so this never uses keep-n-tagged -- which is also
# why it calls the upstream action directly instead of the shared
# projectbluefin/actions composite, whose keep-n-tagged default would prune
# published point releases.
#
# printing-base-devel (printing-base.yml) is the other exception: a build-time
# BuildStream cache bundle, not an image anyone pins. Its keyed
# `<arch>-<full-key>` tags are superseded by every printing/base.bst change,
# so the last 5 per architecture are kept and older ones pruned below.

on:
  schedule:
    - cron: '0 4 * * 1'  # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Derived from the canonical manifest, so a new image is covered the day
      # it is added instead of whenever someone remembers this file exists.
      - id: packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LIST="$(jq -r '[.oci_images[] | ., "\(.)-x86_64", "\(.)-aarch64"] + ["printing-base-devel"] | join(",")' elements/targets.json)"
          echo "==> candidate packages: ${LIST}"

          # Probe the token's package-list permission ONCE, before the
          # per-package loop. This is the only way to tell two 404s apart:
          #
          #   - "this package was never published"  -> a benign 404 that must
          #     be skipped, so an in-manifest-but-unpublished image does not
          #     404 the whole run.
          #   - "this package is not visible to this token" -> a scope or
          #     credential regression, ALSO a 404, which must NOT be silently
          #     skipped: every lookup 404s, EXISTING empties, the prune step
          #     no-ops on its list guard, and untagged images accumulate with
          #     no alarm (projectbluefin/fsdk-containers#306).
          #
          # Probe the canonical `base` canary before classifying per-package
          # 404s. A non-zero result means either the token cannot read packages
          # or the canary has not been published, so fail hard and prune
          # nothing. `errexit` is on, so suspend it across this one expected
          # failure and keep the status in PRC.
          set +e
          PROBE="$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/base/versions" 2>&1)"
          PRC=$?
          set -e
          if [[ "${PRC}" -ne 0 ]]; then
            echo "::error::cannot read canary package base (exit ${PRC}): token lacks package visibility or base is unpublished; refusing to prune"
            echo "${PROBE}" >&2
            exit 1
          fi

          # A target in the manifest that GHCR has not published yet (a
          # brand-new image before its first fsdk-updated publish) makes the
          # cleanup action's package lookup return HTTP 404 and fail the whole
          # run. Only hand the action packages that actually exist, so an
          # in-manifest-but-unpublished image is skipped instead of breaking a
          # scheduled cleanup.
          #
          # The probe above proved the token has read:packages, so a
          # per-package 404 now genuinely means "absent" rather than "not
          # visible", and skipping it is correct. Gate on BOTH a non-zero exit
          # status and the "not found" body: a bare assignment inherits its
          # command substitution's exit status under `errexit`, so suspend it
          # across that one expected failure and keep the status in RC. Gating
          # on RC as well as the message means a successful response that
          # merely mentions "not found" can never drop a live package, and any
          # other failure (a 5xx, a rate limit) keeps the package, so cleanup
          # never silently disables itself.
          EXISTING=()
          IFS=',' read -ra PKGS <<< "${LIST}"
          for pkg in "${PKGS[@]}"; do
            set +e
            RESP="$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${pkg}/versions" 2>&1)"
            RC=$?
            set -e
            if [[ "${RC}" -ne 0 ]] && printf '%s' "${RESP}" | grep -qi 'not found'; then
              echo "== skipping unpublished package: ${pkg}"
            else
              EXISTING+=("${pkg}")
            fi
          done
          FILTERED="$(printf '%s\n' "${EXISTING[@]}" | paste -sd, -)"
          echo "==> cleaning: ${FILTERED}"
          echo "list=${FILTERED}" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "${EXISTING[@]}" | grep -qx printing-base-devel; then
            echo "printing=true" >> "$GITHUB_OUTPUT"
          fi

      # #23 stopped publishing :latest, but the pre-#23 tags were never
      # removed, so they still resolve to frozen July images (issue #364).
      # The untagged prune below never touches them -- it deletes only
      # untagged manifests, and :latest is a tagged manifest, so it survives
      # on its own -- so reap them here: delete the bare :latest from every
      # published package so unpinned consumers fail loudly instead of
      # silently pulling a two-month-old image.
      #
      # Uses the same dataaxiom action as the untagged prune (pinned below),
      # not crane: a bare `crane tags list`/`crane delete` cannot operate on
      # GHCR (deleting a tag returns 405 UNSUPPORTED, and crane reads neither
      # GH_TOKEN nor GITHUB_TOKEN, so it had no credential here anyway), and
      # `delete-tags: latest` with `delete-untagged: false` and no age filter
      # deletes ONLY the bare :latest tag, never an immutable point release.
      # The action re-points a :latest that shares a digest with a
      # YY.MM.X tag before deleting it, so the point release survives.
      #
      # Scheduled runs always dry-run (LIST only); a human must
      # workflow_dispatch with the unchecked box to actually delete -- this is
      # a destructive op on shared registry state and should not run blind on
      # a cron. `github.event_name != 'workflow_dispatch'` forces dry-run on the
      # schedule trigger, where `inputs.*` is empty.
      - name: Delete stale :latest tags
        if: steps.packages.outputs.list != ''
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: ${{ steps.packages.outputs.list }}
          delete-tags: latest
          delete-untagged: false
          dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune untagged images
        # Skip the whole action when no candidate package exists on GHCR yet
        # (e.g. the only unpublished target), so a run against a fresh manifest
        # is a clean no-op instead of a 404 failure. Zero visible packages is
        # NOT an error on its own: a brand-new, all-unpublished manifest
        # legitimately resolves to zero (docs/skills/ci-tooling/references/
        # workflow-structure.md). The token-permission probe above is what
        # makes a credential regression audible, not this guard.
        if: steps.packages.outputs.list != ''
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: ${{ steps.packages.outputs.list }}
          delete-untagged: true
          older-than: 90 days
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # printing-base-devel only: keep the newest 5 tagged bundles per
      # architecture (`<arch>-<key>`, plus `<arch>-test-<run_id>` from branch
      # dispatches). `<arch>-latest` and the other architecture are excluded,
      # as are cosign's `sha256-*` signature tags, which delete-orphaned-images
      # removes once the digest they sign is gone.
      - name: Keep the last 5 printing-base-devel bundles (x86_64)
        if: steps.packages.outputs.printing == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: printing-base-devel
          keep-n-tagged: 5
          exclude-tags: 'x86_64-latest,aarch64-*,sha256-*'
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the last 5 printing-base-devel bundles (aarch64)
        if: steps.packages.outputs.printing == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: printing-base-devel
          keep-n-tagged: 5
          exclude-tags: 'aarch64-latest,x86_64-*,sha256-*'
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
