name: Refresh BuildStream refs

# Renovate can bump a version (a `<tool>_version:` variable or a `track:` pin) but it
# cannot recompute the BuildStream `ref:` that accompanies it — a sha256 for `tar`/
# `remote` sources, a commit for `git_repo` sources. Without the matching ref the build
# fails on a checksum mismatch, so every Renovate PR that touches an element needs
# `bst source track` run against it.
#
# This workflow does that automatically and pushes the refreshed refs back onto the PR
# branch, so a Renovate PR arrives ready to build. See docs/skills/track-upstream-versions.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'elements/*.bst'
      - 'elements/**/*.bst'

permissions:
  contents: read

concurrency:
  group: refresh-bst-refs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    # Only act on Renovate's own PRs. Running this on contributor PRs would let an
    # untrusted branch trigger a write-back.
    #
    # Renovate opens PRs with the mergeraptor GitHub App installation token (see
    # renovate.yml), not the default renovate[bot] identity, so the PR author is
    # `mergeraptor[bot]` -- matching the identity this job already commits back
    # as, below. Gating on `renovate[bot]` here always evaluated false, so this
    # job silently skipped on every version bump and the corresponding `ref:`
    # was never refreshed (confirmed reproducing on #156: this job "skipped",
    # then `Build images` failed on a checksum mismatch).
    if: github.event.pull_request.user.login == 'mergeraptor[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get mergeraptor token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ steps.token.outputs.token }}
          # Full history: the three-dot diff below needs a merge base, and two
          # disjoint depth-1 fetches have no common history ("no merge base").
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Determine changed elements
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # 'elements/**/*.bst' alone misses top-level elements (e.g.
          # elements/freedesktop-sdk.bst) — match both depths.
          mapfile -t FILES < <(git diff --name-only "$BASE_SHA"...HEAD -- 'elements/*.bst' 'elements/**/*.bst')
          # The FSDK junction is tracked by auto-update-fsdk.yml, not here:
          # re-tracking it on a bump PR could move the version under review.
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "elements=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `bst` addresses elements relative to element-path (elements/), not the repo root.
          ELEMENTS=()
          for f in "${FILES[@]}"; do
            [ "$f" = "elements/freedesktop-sdk.bst" ] && continue
            ELEMENTS+=("${f#elements/}")
          done
          echo "elements=${ELEMENTS[*]}" >> "$GITHUB_OUTPUT"
          printf 'Refreshing: %s\n' "${ELEMENTS[*]}"

      - name: Track sources
        if: steps.changed.outputs.elements != ''
        env:
          BST_LOCAL: '1'
          # Via env, not ${{ }} interpolation: PR-derived filenames are a
          # template-injection sink in a `run:` shell.
          ELEMENTS: ${{ steps.changed.outputs.elements }}
        run: |
          # shellcheck disable=SC2086  # word splitting intended: multiple element args
          just bst source track $ELEMENTS

      - name: Validate element graph
        if: steps.changed.outputs.elements != ''
        env:
          BST_LOCAL: '1'
        run: just validate

      - name: Commit refreshed refs
        if: steps.changed.outputs.elements != ''
        run: |
          set -euo pipefail
          if git diff --quiet -- 'elements/*.bst' 'elements/**/*.bst'; then
            echo "Refs already current; nothing to push."
            exit 0
          fi
          git config user.name 'mergeraptor[bot]'
          git config user.email '${{ secrets.MERGERAPTOR_APP_ID }}+mergeraptor[bot]@users.noreply.github.com'
          git add 'elements/*.bst' 'elements/**/*.bst'
          git commit -m 'chore(deps): refresh BuildStream source refs'
          git push
