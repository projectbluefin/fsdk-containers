name: Build VM guest

# Reusable workflow for the podman-vm guest disk (elements/podman-vm/*, see
# docs/skills/vm-podman-guest/SKILL.md and docs/skills/donate-clanker-vm-artifacts.md).
# This is a full-OS bootable EFI/raw disk, NOT an OCI image: it is
# deliberately excluded from oci-images.yml's manifest so a failure in an
# unrelated OCI image (e.g. lab-runner, static) never blocks or obscures
# this pipeline, and vice versa.
#
# Each matrix leg builds, converts, checksums, SBOMs, boot-tests, and
# publishes only its own architecture's artifacts as steps in a
# single job. A separate downstream job with `needs` on this matrix job
# would wait for every architecture leg before publishing anything -- see
# docs/skills/ci-tooling/SKILL.md ("Independent architecture asset publication").

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (supports repository_dispatch client_payload.ref).
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
      attestations: write
      id-token: write # Required for the GitHub artifact attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just

      - name: Install qemu-img (raw -> QCOW2 conversion) and zstd (asset compression)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils zstd

      - name: Build and export the ${{ matrix.arch }} podman-vm guest disk (raw + QCOW2)
        id: export
        run: |
          just export-podman-vm-qcow2

      - name: Verify checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          disks=(dist-vm/donate-clanker-vm-*.raw dist-vm/donate-clanker-vm-*.qcow2)
          shopt -u nullglob
          test "${#disks[@]}" -eq 2
          for d in "${disks[@]}"; do
            ( cd dist-vm && sha256sum -c "$(basename "$d").sha256" )
          done

      # Both architectures are boot-tested, each on its own native runner, so
      # neither is published on a build-and-checksum gate alone. The disk is
      # booted the way its only consumer boots it -- plain qemu-system-<arch>
      # with EDK2/OVMF pflash firmware over a QCOW2 overlay, see
      # tests/vm-boot.sh -- not under Lima, which this guest ships no
      # cloud-init, SSH or guest agent to satisfy, so a Lima failure never
      # reliably meant the disk was broken.
      #
      # The aarch64 runner is native arm64 but has no nested virtualization,
      # so that leg boots under TCG on its own architecture -- slow, but not
      # cross-architecture emulation, and it is a real boot of the real disk.
      # Emulating aarch64 on an x86_64 runner would be slower still for no
      # extra coverage, and skipping the leg would let an unbootable aarch64
      # disk reach a release. tests/vm-boot.sh raises its own timeout to 1800s
      # when it detects TCG; the job timeout above accommodates that.
      #
      # The setup and the boot itself live in a composite action shared with
      # the pull-request gate in build.yml, so the gate cannot drift from the
      # check that actually guards publication.
      - name: Boot-test the ${{ matrix.arch }} disk under QEMU
        uses: ./.github/actions/vm-boot-test
        with:
          arch: ${{ matrix.arch }}

      - name: Generate BuildStream-native SBOM for the VM guest
        run: just sbom podman-vm

      # Compress the disks for publication. GitHub caps a release asset at
      # 2 GiB and the raw disk is larger than that, so the uncompressed disk
      # is not publishable -- see the compress-podman-vm recipe. Runs after
      # the checksum, boot-test, and SBOM gates so nothing is compressed that
      # was not first verified.
      - name: Compress the disk images for release publication
        run: just compress-podman-vm

      # repository_dispatch is verification-only and must never publish branch
      # content. Point-release assets are immutable: a COMPLETE architecture
      # asset set is never overwritten, while a partial set left behind by an
      # earlier failed publish is deleted and republished. The recipe uploads
      # this architecture's set as an all-or-nothing transaction (preflight
      # size check, rollback on failure, post-upload verification), so a
      # checksum can never reach the release without its disk.
      - name: Publish the ${{ matrix.arch }} disks, checksums, and SBOM
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp podman-vm.spdx.json "dist-vm/podman-vm-${{ matrix.arch }}.spdx.json"
          just publish-podman-vm

      - name: Generate GitHub artifact attestation for the disk images
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist-vm/donate-clanker-vm-*.raw
            dist-vm/donate-clanker-vm-*.qcow2
            dist-vm/donate-clanker-vm-*.raw.zst
            dist-vm/donate-clanker-vm-*.qcow2.zst
          push-to-registry: false

      - name: Attach GitHub SBOM attestation for the disk images
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist-vm/donate-clanker-vm-*.raw
            dist-vm/donate-clanker-vm-*.qcow2
            dist-vm/donate-clanker-vm-*.raw.zst
            dist-vm/donate-clanker-vm-*.qcow2.zst
          sbom-path: podman-vm.spdx.json
          push-to-registry: false

  # Publication is per architecture (see docs/skills/ci-tooling/SKILL.md), so no
  # single job can make the two-architecture release atomic. This job makes an
  # incomplete release impossible to miss instead: it runs after both legs,
  # regardless of their outcome, and fails if the point-release tag is missing
  # any expected asset. A release that carries only one architecture, or a
  # checksum without its disk, is a red X here rather than a silent success.
  verify-release:
    needs: build
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just
      - name: Verify the release carries a complete asset set for both architectures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(just --evaluate fsdk_version)"
          TAG="v${VERSION}"
          if ! ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            echo "FAIL: release ${TAG} does not exist -- no VM guest assets were published" >&2
            exit 1
          fi
          missing=()
          for arch in x86_64 aarch64; do
            base="donate-clanker-vm-${VERSION}-${arch}"
            for name in \
              "${base}.raw.zst" "${base}.raw.zst.sha256" "${base}.raw.sha256" \
              "${base}.qcow2.zst" "${base}.qcow2.zst.sha256" "${base}.qcow2.sha256" \
              "podman-vm-${arch}.spdx.json"; do
              printf '%s\n' "$ASSETS" | grep -qxF "$name" || missing+=("$name")
            done
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "FAIL: release ${TAG} is incomplete -- ${#missing[@]} asset(s) missing:" >&2
            printf '    %s\n' "${missing[@]}" >&2
            echo "Consumers such as projectbluefin/donate-clanker require the complete two-architecture set." >&2
            exit 1
          fi
          echo "OK: release ${TAG} carries the complete two-architecture VM guest asset set"
