name: skopeo
kind: distroless
description: Distroless skopeo image carved from freedesktop-sdk
keywords: distroless,freedesktop-sdk,bluefin,skopeo
smoke:
  args: ["skopeo", "--version"]
size_ceiling_mib: 224
stack:
