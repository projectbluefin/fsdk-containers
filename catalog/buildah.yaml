name: buildah
kind: distroless
description: Distroless Buildah container-building tool built on freedesktop-sdk
export_description: Distroless Buildah container-building tool built on freedesktop-sdk
keywords: distroless,freedesktop-sdk,bluefin,buildah
entrypoint: ["/usr/bin/buildah"]
smoke:
  args: ["--version"]
stack:
  depends:
    - base/base-stack.bst
    - buildah/buildah.bst
    - freedesktop-sdk.bst:components/containers-common.bst
    - freedesktop-sdk.bst:components/gpgme.bst
    - freedesktop-sdk.bst:components/libassuan.bst
    - freedesktop-sdk.bst:components/libgpg-error.bst
    - freedesktop-sdk.bst:components/libseccomp.bst
    - freedesktop-sdk.bst:components/glib.bst
    - freedesktop-sdk.bst:components/sqlite.bst
gates:
  require_paths:
    - usr/share/zoneinfo/UTC
    - etc/containers/storage.conf
    - usr/bin/fuse-overlayfs
    - usr/libexec/podman/netavark
slim:
  # fuse-overlayfs -> fuse3 -> util-linux runtime-depends libmagic, whose
  # 10.8 MB magic database nothing in this image reads. netavark
  # runtime-depends aardvark-dns (2.5 MB), which serves DNS only to `buildah
  # run` containers; the image ships no OCI runtime, so it is never started
  # (buildah tolerates it missing).
  extra: |
    rm -f /layer/usr/share/misc/magic.mgc /layer/usr/libexec/podman/aardvark-dns
