name: python
kind: distroless
description: Distroless Python 3 image built on freedesktop-sdk
export_description: Minimal, high-integrity distroless Python 3 runtime built on freedesktop-sdk
keywords: distroless,freedesktop-sdk,bluefin,python
entrypoint: ["/usr/bin/python3"]
smoke:
  # Exercise real stdlib functionality, not just --version. The #130 jlink
  # failure passed --version and would have shipped broken; a probe that only
  # prints a version proves nothing about what the image can actually do. This
  # imports the modules a container Python runtime must support (json
  # serialization, ssl/TLS, ctypes FFI, sqlite3) and, via zoneinfo, proves the
  # kept tzdata is reachable. Requires the python3 entrypoint from the record.
  args: ["-c", "import sys, json, ssl, ctypes, sqlite3, zoneinfo; print(sys.version.split()[0])"]
size_ceiling_mib: 144
stack:
  depends:
    - base/base-stack.bst
    - freedesktop-sdk.bst:components/python3.bst
gates:
  require_paths:
    - usr/share/zoneinfo/UTC
slim:
  # Python-family bloat stripping lives in include/slim-python.yml (a shared
  # recipe, not an inline block) so any future Python image inherits it. The
  # generator emits `- include/slim-python.yml` and `-%{slim-python-commands}`
  # for this record. See docs/skills/slim-an-image.md — Per-family recipes.
  includes: [slim-python.yml]
