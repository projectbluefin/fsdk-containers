# Build-time regression gate: fails the OCI script element if any forbidden
# path survived (a new FSDK release that moves a file, a consumer stack that
# stages a removed tool again, or an edit to the recipe that lost a line).
# Runs in the same sandbox right after slim-printing-commands, so the image
# cannot be produced without it. It also checks a small keep-list every
# printer appliance shares (the shell, coreutils, the common charsets, the
# CA bundle; the interpreter, its plain .pyc and lzma when python3 is staged
# at all), so a recipe typo that deletes them is caught here, not by the
# smoke test. Nothing a single consumer keeps on purpose is required.
slim-printing-gate-commands: |
  set -eu
  L=/layer
  shopt -s nullglob globstar
  bad=0
  while IFS= read -r pattern; do
    [ -n "$pattern" ] || continue
    for match in "$L"/$pattern; do
      [ -e "$match" ] || [ -L "$match" ] || continue
      echo "slim-printing: forbidden path present: ${match#"$L"}" >&2
      bad=1
    done
  done <<'FORBIDDEN'
  %{slim-printing-forbidden-paths}
  FORBIDDEN
  # require GLOB...: at least one of the alternatives must match.
  require() {
    for alternative; do
      for match in "$L"/$alternative; do
        # Absolute symlinks (etc/pki/tls/certs/ca-bundle.crt) resolve
        # against the sandbox root, not /layer: accept the link itself.
        if [ -e "$match" ] || [ -L "$match" ]; then return 0; fi
      done
    done
    echo "slim-printing: required path missing: $*" >&2
    bad=1
  }
  require usr/bin/bash
  require usr/bin/cat
  require 'usr/lib/*/gconv/UTF-16.so'
  require 'usr/lib/*/gconv/gconv-modules'
  require etc/pki/tls/certs/ca-bundle.crt etc/ssl/certs/ca-certificates.crt
  if [ -e "$L"/usr/bin/python3 ]; then
    require 'usr/lib/python3*/lzma.py'
    require 'usr/lib/python3*/lib-dynload/_lzma.*.so'
    require 'usr/lib/python3*/json/__pycache__/__init__.cpython-*.pyc'
    require 'usr/lib/python3*/encodings/utf_8.py'
  fi
  [ "$bad" -eq 0 ] || exit 1
  echo "slim-printing: gate passed"
