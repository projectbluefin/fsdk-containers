  usr/lib/*/libhwy_contrib.so*
  usr/lib/*/libhwy_test.so*
  usr/lib/*/libturbojpeg.so*
  usr/lib/*/libharfbuzz-subset.so*
  usr/lib/*/libgnutlsxx.so*
  usr/lib/*/libtiffxx.so*
  usr/lib/*/libgmpxx.so*
  usr/lib/*/libpoppler-cpp.so*
  usr/lib/*/libgif.so*
