# Shared runtime-domain cleanup for OCI images.
# Included under an element's variables: mapping with (@).
slim-distroless-commands: |
  set -eu
  L=/layer

  # Shells are in the runtime domain, not the shells split-rule domain.
  rm -f "$L"/usr/bin/bash "$L"/usr/bin/sh "$L"/bin/bash "$L"/bin/sh "$L"/usr/bin/bashbug
  rm -rf "$L"/usr/lib/bash "$L"/usr/lib/*/bash

  # terminfo is KEPT: 12M unpacked, ~0.5M compressed. Without it a container
  # must lie about the host TERM or vendor its own entries; both produced
  # real color/rendering bugs downstream (projectbluefin/review).
  rm -f "$L"/usr/lib/*/libasan.so* "$L"/usr/lib/*/libtsan.so* \
        "$L"/usr/lib/*/liblsan.so* "$L"/usr/lib/*/libubsan.so* \
        "$L"/usr/lib/*/libhwasan.so* "$L"/usr/lib/*/libgfortran.so*

  # Separated DWARF leaks the `debug` split domain too (same trap as bash
  # escaping `shells`): base-runtime.bst and static-runtime.bst list `debug`
  # under compose exclude:, but ~905 KB still ships in every base-derived
  # image. Nothing at runtime reads separated DWARF, so this is a safe
  # unconditional removal. Verify against the built rootfs; never trust
  # compose exclude: on its own (docs/skills/slim-an-image/SKILL.md).
  rm -rf "$L"/usr/lib/debug

  # Keep common character sets; remove the gconv long tail.
  for g in "$L"/usr/lib/*/gconv; do
    [ -d "$g" ] || continue
    for f in "$g"/*; do
      [ -f "$f" ] || continue
      case "${f##*/}" in
        gconv-modules*|UTF*|UNICODE*|ISO8859-1.so|ISO8859-15.so|CP1252.so|ANSI_X3.110.so) : ;;
        *) rm -f "$f" ;;
      esac
    done
  done

  rm -f "$L"/usr/lib/locale/locale-archive
  rm -rf "$L"/usr/share/i18n/charmaps
  rm -f "$L"/usr/bin/localedef "$L"/usr/bin/sln "$L"/usr/bin/iconvconfig \
        "$L"/usr/bin/ldconfig "$L"/usr/sbin/ldconfig \
        "$L"/usr/bin/pcre2test "$L"/usr/bin/pcre2grep
  rm -f "$L"/usr/lib/*/libpcre2-16.so* "$L"/usr/lib/*/libpcre2-32.so* \
        "$L"/usr/lib/*/libpcre2-posix.so*

slim-shell-enabled-commands: |
  set -eu
  L=/layer
  # terminfo is KEPT: see slim-distroless-commands.

  rm -f "$L"/usr/lib/*/libasan.so* "$L"/usr/lib/*/libtsan.so* \
        "$L"/usr/lib/*/liblsan.so* "$L"/usr/lib/*/libubsan.so* \
        "$L"/usr/lib/*/libhwasan.so* "$L"/usr/lib/*/libgfortran.so*
  # Separated DWARF: same `debug` split-domain leak as the distroless recipe.
  # Safe to remove in the shell-enabled image too.
  rm -rf "$L"/usr/lib/debug
  for g in "$L"/usr/lib/*/gconv; do
    [ -d "$g" ] || continue
    for f in "$g"/*; do
      [ -f "$f" ] || continue
      case "${f##*/}" in
        gconv-modules*|UTF*|UNICODE*|ISO8859-1.so|ISO8859-15.so|CP1252.so|ANSI_X3.110.so) : ;;
        *) rm -f "$f" ;;
      esac
    done
  done
  rm -f "$L"/usr/lib/locale/locale-archive
  rm -rf "$L"/usr/share/i18n/charmaps
  rm -f "$L"/usr/bin/localedef "$L"/usr/bin/sln "$L"/usr/bin/iconvconfig \
        "$L"/usr/bin/ldconfig "$L"/usr/sbin/ldconfig \
        "$L"/usr/bin/pcre2test "$L"/usr/bin/pcre2grep
  rm -f "$L"/usr/lib/*/libpcre2-16.so* "$L"/usr/lib/*/libpcre2-32.so* \
        "$L"/usr/lib/*/libpcre2-posix.so*
