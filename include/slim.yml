# Shared runtime-domain cleanup for OCI images.
# Included under an element's variables: mapping with (@).
slim-distroless-commands: |
  set -eu
  L=/layer

  # Shells are in the runtime domain, not the shells split-rule domain.
  rm -f "$L"/usr/bin/bash "$L"/usr/bin/sh "$L"/bin/bash "$L"/bin/sh "$L"/usr/bin/bashbug
  rm -rf "$L"/usr/lib/bash "$L"/usr/lib/*/bash

  # terminfo is KEPT: 12M unpacked, ~0.5M compressed. Without it a container
  # must lie about the host TERM or vendor its own entries; both produced
  # real color/rendering bugs downstream (projectbluefin/review).
  rm -f "$L"/usr/lib/*/libasan.so* "$L"/usr/lib/*/libtsan.so* \
        "$L"/usr/lib/*/liblsan.so* "$L"/usr/lib/*/libubsan.so* \
        "$L"/usr/lib/*/libhwasan.so* "$L"/usr/lib/*/libgfortran.so*

  # Separated DWARF leaks the `debug` split domain too (same trap as bash
  # escaping `shells`): base-runtime.bst and static-runtime.bst list `debug`
  # under compose exclude:, but ~905 KB still ships in every base-derived
  # image. Nothing at runtime reads separated DWARF, so this is a safe
  # unconditional removal. Verify against the built rootfs; never trust
  # compose exclude: on its own (docs/skills/slim-an-image/SKILL.md).
  rm -rf "$L"/usr/lib/debug

  # Keep common character sets; remove the gconv long tail.
  for g in "$L"/usr/lib/*/gconv; do
    [ -d "$g" ] || continue
    for f in "$g"/*; do
      [ -f "$f" ] || continue
      case "${f##*/}" in
        gconv-modules*|UTF*|UNICODE*|ISO8859-1.so|ISO8859-15.so|CP1252.so|ANSI_X3.110.so) : ;;
        *) rm -f "$f" ;;
      esac
    done
  done

  # Only C.utf8 is kept: en_US.utf8 is 2.9 MB (2.6 MB of it LC_COLLATE) that
  # nothing selects -- no image sets LANG, and consumers set LANG=C.UTF-8.
  rm -f "$L"/usr/lib/locale/locale-archive
  rm -rf "$L"/usr/lib/locale/en_US.utf8
  rm -rf "$L"/usr/share/i18n/charmaps
  rm -f "$L"/usr/bin/localedef "$L"/usr/bin/sln "$L"/usr/bin/iconvconfig \
        "$L"/usr/bin/ldconfig "$L"/usr/sbin/ldconfig \
        "$L"/usr/bin/pcre2test "$L"/usr/bin/pcre2grep
  rm -f "$L"/usr/lib/*/libpcre2-16.so* "$L"/usr/lib/*/libpcre2-32.so* \
        "$L"/usr/lib/*/libpcre2-posix.so*

  # Base userland: every executable runtime-gnu/runtime-minimal and the CA
  # stack put in usr/bin (~14 MB, 184 entries; distroless/base-debian12 ships
  # none). Without a shell nothing can call them, and the CA bundle is already
  # extracted at compose time. Libraries (p11-kit trust module, libselinux,
  # libacl...) stay. Explicit names, never usr/bin/*: the same recipe runs on
  # images whose payload binaries also live in usr/bin. Downstream images that
  # add a shell on top of base (projectbluefin/contribute) stage their own
  # coreutils.
  (
  cd "$L"/usr/bin
  # coreutils
  rm -f '[' arch b2sum base32 base64 basename basenc cat chcon chgrp chmod \
        chown chroot cksum comm cp csplit cut date dd df dir dircolors \
        dirname du echo env expand expr factor false fmt fold groups head \
        hostid hostname id install join link ln logname ls md5sum mkdir \
        mkfifo mknod mktemp mv nice nl nohup nproc numfmt od paste pathchk \
        pinky pr printenv printf ptx pwd readlink realpath rm rmdir runcon \
        seq sha1sum sha224sum sha256sum sha384sum sha512sum shred shuf \
        sleep sort split stat stdbuf stty sum sync tac tail tee test timeout \
        touch tr true truncate tsort tty uname unexpand uniq unlink users \
        vdir wc who whoami yes
  # glibc
  rm -f gencat getconf getent iconv ld.so ldd locale makedb mtrace nscd \
        pcprofiledump pldd sotruss sprof tzselect xtrace zdump zic
  # libselinux / libsepol
  rm -f avcstat chkcon compute_av compute_create compute_member \
        compute_relabel getconlist getdefaultcon getenforce getfilecon \
        getpidcon getpidprevcon getpolicyload getsebool getseuser \
        matchpathcon policyvers sefcontext_compile selabel_compare \
        selabel_digest selabel_get_digests_all_partial_matches \
        selabel_lookup selabel_lookup_best_match selabel_partial_match \
        selinux_check_access selinux_check_securetty_context selinuxenabled \
        selinuxexeccon sepol_check_access sepol_compute_av \
        sepol_compute_member sepol_compute_relabel sepol_validate_transition \
        setenforce setfilecon togglesebool validatetrans
  # acl, attr, libtasn1
  rm -f attr chacl getfacl getfattr setfacl setfattr \
        asn1Coding asn1Decoding asn1Parser
  # ncurses tools (the terminfo database itself is kept)
  rm -f captoinfo clear infocmp infotocap reset tabs tic toe tput tset
  # p11-kit, ca-certificates
  rm -f p11-kit trust ca-legacy update-ca-trust
  )
  rm -rf "$L"/usr/libexec/coreutils "$L"/usr/libexec/p11-kit

slim-shell-enabled-commands: |
  set -eu
  L=/layer
  # terminfo is KEPT: see slim-distroless-commands.

  # Perl rides in as git's dependency and costs ~56M — more than the three
  # CI linters combined. Nothing in the CLI contract is perl, and modern
  # git implements its everyday commands in C; only the perl-scripted
  # long tail (svn/cvs interop, send-email, instaweb, request-pull) needs
  # the interpreter, so those scripts leave with it rather than staying
  # behind broken.
  rm -rf "$L"/usr/lib/perl5 "$L"/usr/share/perl5
  rm -f "$L"/usr/bin/perl "$L"/usr/bin/perl5* "$L"/usr/bin/perlbug \
        "$L"/usr/bin/perldoc "$L"/usr/bin/perlivp "$L"/usr/bin/perlthanks \
        "$L"/usr/bin/corelist "$L"/usr/bin/cpan "$L"/usr/bin/enc2xs \
        "$L"/usr/bin/encguess "$L"/usr/bin/h2ph "$L"/usr/bin/h2xs \
        "$L"/usr/bin/instmodsh "$L"/usr/bin/json_pp "$L"/usr/bin/libnetcfg \
        "$L"/usr/bin/piconv "$L"/usr/bin/pl2pm "$L"/usr/bin/pod2html \
        "$L"/usr/bin/pod2man "$L"/usr/bin/pod2text "$L"/usr/bin/pod2usage \
        "$L"/usr/bin/podchecker "$L"/usr/bin/prove "$L"/usr/bin/ptar \
        "$L"/usr/bin/ptardiff "$L"/usr/bin/ptargrep "$L"/usr/bin/shasum \
        "$L"/usr/bin/splain "$L"/usr/bin/streamzip "$L"/usr/bin/xsubpp \
        "$L"/usr/bin/zipdetails
  rm -f "$L"/usr/libexec/git-core/git-archimport \
        "$L"/usr/libexec/git-core/git-cvsexportcommit \
        "$L"/usr/libexec/git-core/git-cvsimport \
        "$L"/usr/libexec/git-core/git-cvsserver \
        "$L"/usr/libexec/git-core/git-instaweb \
        "$L"/usr/libexec/git-core/git-request-pull \
        "$L"/usr/libexec/git-core/git-send-email \
        "$L"/usr/libexec/git-core/git-svn

  rm -f "$L"/usr/lib/*/libasan.so* "$L"/usr/lib/*/libtsan.so* \
        "$L"/usr/lib/*/liblsan.so* "$L"/usr/lib/*/libubsan.so* \
        "$L"/usr/lib/*/libhwasan.so* "$L"/usr/lib/*/libgfortran.so*
  # Separated DWARF: same `debug` split-domain leak as the distroless recipe.
  # Safe to remove in the shell-enabled image too.
  rm -rf "$L"/usr/lib/debug
  for g in "$L"/usr/lib/*/gconv; do
    [ -d "$g" ] || continue
    for f in "$g"/*; do
      [ -f "$f" ] || continue
      case "${f##*/}" in
        gconv-modules*|UTF*|UNICODE*|ISO8859-1.so|ISO8859-15.so|CP1252.so|ANSI_X3.110.so) : ;;
        *) rm -f "$f" ;;
      esac
    done
  done
  rm -f "$L"/usr/lib/locale/locale-archive
  rm -rf "$L"/usr/share/i18n/charmaps
  rm -f "$L"/usr/bin/localedef "$L"/usr/bin/sln "$L"/usr/bin/iconvconfig \
        "$L"/usr/bin/ldconfig "$L"/usr/sbin/ldconfig \
        "$L"/usr/bin/pcre2test "$L"/usr/bin/pcre2grep
  rm -f "$L"/usr/lib/*/libpcre2-16.so* "$L"/usr/lib/*/libpcre2-32.so* \
        "$L"/usr/lib/*/libpcre2-posix.so*
