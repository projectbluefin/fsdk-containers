name: fsdk-containers

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - gnome-build-meta.bst:freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64

sandbox:
  build-arch: "%{arch}"

variables:
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
    - arch == "aarch64":
        go-arch: "arm64"

# Pull-only: read from the shared GNOME + Bluefin BuildStream CAS caches.
artifacts:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      # pyproject: `python -mbuild --no-isolation --wheel` then
      # `python -minstaller`. --no-isolation is the whole point on the
      # BuildBarn grid, where the build phase has no network and pip can
      # resolve nothing: every build dependency has to arrive as a declared
      # build-depends element. This is the same element kind FSDK's own 109
      # components/python3-*.bst use, so riders inherit a proven pattern
      # rather than a bespoke one.
      - pyproject
    sources:
      - git_repo
      - go_module
      - patch_queue
      # cargo2: vendors the crates named in a Cargo.lock and writes the
      # .cargo/config.toml that points cargo at them, so a Python package
      # with a compiled Rust extension builds offline.
      - cargo2
  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe
