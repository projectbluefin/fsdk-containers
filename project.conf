name: fsdk-containers

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - gnome-build-meta.bst:freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64

sandbox:
  build-arch: "%{arch}"

variables:
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
    - arch == "aarch64":
        go-arch: "arm64"

# Pull-only: read from the shared GNOME + Bluefin BuildStream CAS caches.
artifacts:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      # The pyproject build element (`python -m build --no-isolation --wheel`
      # + `python -minstaller`) builds PyPI sdists fully offline against
      # declared build-depends. This is the established pattern every
      # python3-* component in FSDK itself uses, and the pattern python-app
      # riders (custodian et al.) inherit — see docs/skills/python-rider.md.
      - pyproject
    sources:
      - git_repo
      - patch_queue
      # zip: fetch the upstream c7n wheel (cloud-custodian publishes c7n as a
      # wheel only, no sdist) from its content-addressed PyPI URL.
      - zip
      # cargo2: vendored Rust crates from a Cargo.lock, offline. Required to
      # build rpds-py (jsonschema's compiled dependency) from its sdist.
      - cargo2
  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe
